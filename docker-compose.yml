
services:
  backend:
    build: ./server
    container_name: faculty-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    container_name: faculty-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
