.em{text-align:center;padding:48px 16px;color:var(--mu)}.em b{display:block;font:500 24px 'Cormorant Garamond',Georgia,serif;color:var(--tx)}

.md{background:var(--cd);border-radius:18px;padding:26px;width:min(520px,100%);max-height:90vh;overflow:auto}.md h2{font-size:30px;margin-bottom:14px}

function go(p){if(S.me&&PAGES[S.me.role]&&!PAGES[S.me.role].includes(p))p='dashboard';page=p;ls={q:'',f:{},p:1};$('#gs').value='';nav();render()}
function render(){const m=$('#main');if(page=='dashboard')return dash(m);if(page=='reports')return reports(m);if(page=='settings')return settings(m);
const e=E[page],cp=CAP();m.innerHTML=`<div class="ph1"><div><h1>${e.t}</h1><p>${e.s}</p></div><div class="ac">${page=='attendance'&&S.me.fid?'<button class="btn o" id="tin">Time in</button><button class="btn o" id="tout">Time out</button>':''}${cp.add?`<button class="btn" id="add">${ic('plus')}${e.a}</button>`:''}</div></div>
<div class="card"><div class="fl"><input id="q" placeholder="${e.ph}" value="${esc(ls.q)}">${e.flt.map(([k,l])=>`<select data-k="${k}"><option value="">${l}</option>${[...new Set(S[page].map(r=>r[k]).filter(Boolean))].sort().map(v=>`<option ${ls.f[k]==v?'selected':''}>${esc(v)}</option>`).join('')}</select>`).join('')}</div><div class="tb" id="tb"></div><div class="pg" id="pg"></div></div>`;
if($('#add'))$('#add').onclick=()=>form();if($('#tin')){$('#tin').onclick=()=>clock('in');$('#tout').onclick=()=>clock('out')}$('#q').oninput=x=>{ls.q=x.target.value;ls.p=1;draw()};
m.querySelectorAll('select[data-k]').forEach(s=>s.onchange=()=>{ls.f[s.dataset.k]=s.value;ls.p=1;draw()});draw()}
function draw(){const e=E[page],s=ls.q.toLowerCase();
const rows=S[page].filter(r=>(!s||Object.entries(r).some(([k,v])=>k!='photo'&&k!='_id'&&String(v).toLowerCase().includes(s)))&&Object.entries(ls.f).every(([k,v])=>!v||r[k]==v));
const pp=5,pages=Math.max(1,Math.ceil(rows.length/pp));ls.p=Math.min(ls.p,pages);const vis=rows.slice((ls.p-1)*pp,ls.p*pp);
$('#tb').innerHTML=rows.length?`<table><thead><tr>${e.c.map(c=>`<th>${c[0]}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${vis.map(r=>`<tr>${e.c.map(c=>`<td>${c[1](r)}</td>`).join('')}<td><div class="ac">${acts(r)}</div></td></tr>`).join('')}</tbody></table>`:
`<div class="em"><b>${S[page].length?'No matches found':'Nothing here yet'}</b>${S[page].length?'Try a different search or clear the filters.':'Use the “'+e.a+'” button to add the first record.'}</div>`;
$('#tb').querySelectorAll('.ib').forEach(b=>b.onclick=()=>{const r=S[page].find(x=>x._id==b.dataset.id);({v:view,e:form,d:del,ok:r=>decide(r,'Approved'),no:r=>decide(r,'Rejected')})[b.dataset.a](r)});
$('#pg').innerHTML=rows.length?`<span>Showing ${(ls.p-1)*pp+1}–${(ls.p-1)*pp+vis.length} of ${rows.length} records</span><div><button ${ls.p<2?'disabled':''} data-n="${ls.p-1}">Previous</button>${Array.from({length:pages},(_,i)=>`<button class="${i+1==ls.p?'on':''}" data-n="${i+1}">${i+1}</button>`).join('')}<button ${ls.p>=pages?'disabled':''} data-n="${ls.p+1}">Next</button></div>`:'';
$('#pg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ls.p=+b.dataset.n;draw()})}
const CAP=()=>{const r=S.me.role,ad=r=='admin',me=!!S.me.fid;return({faculty:{add:ad},nonfaculty:{add:ad},departments:{add:ad},subjects:{add:r!='faculty'},schedules:{add:r!='faculty'},users:{add:ad},leaves:{add:me},attendance:{add:r!='faculty'},grades:{add:ad||me}})[page]||{}};
const mine=x=>x.fid&&x.fid==S.me.fid;
function acts(r){const b=(a,t,i)=>`<button class="ib" data-a="${a}" data-id="${r._id}" title="${t}">${ic(i)}</button>`,R=S.me.role,ad=R=='admin';let h=b('v','View','eye');
if(page=='leaves'){if(r.status=='Pending'&&R!='faculty'&&!mine(r))h+=b('ok','Approve','check')+b('no','Reject','x');if(ad||(mine(r)&&r.status=='Pending'))h+=b('d',ad?'Delete':'Cancel request','trash');return h}
const ed=page=='grades'?(ad||mine(r)):(page=='faculty'||page=='nonfaculty'||page=='departments'||page=='users')?ad:R!='faculty';
return h+(ed?b('e','Edit','edit')+b('d','Delete','trash'):'')}
function decide(r,s){const ok=s=='Approved';modal(`<h2>${ok?'Approve':'Reject'} leave?</h2><p class="er" id="er"></p><p>${esc(r.faculty)} · ${esc(r.type)} · ${esc(r.from)}${r.to!=r.from?' → '+esc(r.to):''}</p><label>Note (optional)<input id="nt" maxlength="200"></label><div class="fa"><button class="btn o" onclick="closeM()">Cancel</button><button class="btn ${ok?'':'d'}" id="yes">${ok?'Approve':'Reject'}</button></div>`);
$('#yes').onclick=async()=>{try{await api('PUT','/leaves/'+r._id+'/decision',{status:s,note:$('#nt').value});await refresh();closeM();nav();render()}catch(x){$('#er').textContent=x.message}}}
async function clock(a){try{await api('POST','/attendance/clock',{action:a});await refresh();render()}catch(x){modal(`<h2>Attendance</h2><p class="er">${esc(x.message)}</p><div class="fa"><button class="btn" onclick="closeM()">OK</button></div>`)}}
const modal=h=>{$('#m').innerHTML=`<div class="md">${h}</div>`;$('#m').classList.add('s')},closeM=()=>$('#m').classList.remove('s');
$('#m').onclick=e=>{if(e.target.id=='m')closeM()};
function view(r){const e=E[page];let extra='';if(page=='faculty')extra=`<dt>Classes</dt><dd>${S.schedules.filter(x=>x.faculty==r.name).map(x=>`${esc(x.subject)} · ${esc(x.day)} ${t12(x.start)}`).join('<br>')||'None assigned'}</dd>`;
modal(`<h2>${esc(r.name||r.code||'Details')}</h2><dl class="dl">${e.f.filter(f=>!['photo','password','sch'].includes(f[2])).map(f=>`<dt>${f[1]}</dt><dd>${esc(r[f[0]]||'—')}</dd>`).join('')}${extra}</dl><div class="fa"><button class="btn o" onclick="closeM()">Close</button></div>`)}
function del(r){modal(`<h2>Delete record?</h2><p class="er" id="er"></p><p>This permanently removes <b>${esc(r.name||r.code||r.subject||r.faculty||r.student)}</b>. This can’t be undone.</p><div class="fa"><button class="btn o" onclick="closeM()">Cancel</button><button class="btn d" id="yes">Delete</button></div>`);
$('#yes').onclick=async()=>{try{await api('DELETE','/'+page+'/'+r._id);await refresh();closeM();nav();render()}catch(x){$('#er').textContent=x.message}}}
function form(r){const e=E[page],v=r||{};photo=v.photo;
if(page=='schedules'&&(!S.subjects.length||!S.faculty.length))return modal(`<h2>Add subjects and faculty first</h2><p>A schedule needs at least one subject and one faculty member.</p><div class="fa"><button class="btn" onclick="closeM()">OK</button></div>`);
if(page!='users'&&e.f.some(f=>f[2]=='dept')&&!S.departments.length)return modal(`<h2>Add a department first</h2><p>Create at least one department so it can be assigned here.</p><div class="fa"><button class="btn o" onclick="closeM()">Close</button><button class="btn" onclick="closeM();go('departments')">Go to Departments</button></div>`);
modal(`<h2>${r?'Edit':'Add'} record</h2><form id="fm"><p class="er" id="er"></p>${e.f.map(([k,l,t='text',o])=>{if(t=='photo')return`<label>${l} (optional)<span style="display:flex;gap:12px;align-items:center;margin-top:5px"><span id="pv">${av({photo,name:v.name})}</span><input type="file" accept="image/*" id="pf"></span></label>`;
if(['sel','dept','fac','sub','sch','fid'].includes(t)){const op=t=='sel'?o:t=='dept'?D():t=='fac'?S.faculty.map(x=>x.name):t=='sch'?S.schedules.filter(x=>S.me.role=='admin'||x.faculty==S.me.fname).map(x=>[x._id,x.subject+' · '+x.section]):t=='fid'?S.faculty.map(x=>[x.id,x.name+' ('+x.id+')']):S.subjects.map(x=>x.code);return`<label>${l}<select name="${k}"><option value="">${t=='fid'||t=='dept'&&page=='users'?'None':'Select…'}</option>${op.map(x=>{const a=Array.isArray(x)?x:[x,x];return`<option value="${esc(a[0])}" ${a[0]==v[k]?'selected':''}>${esc(a[1])}</option>`}).join('')}</select></label>`}
return`<label>${l}<input name="${k}" type="${t}" value="${esc(v[k])}"></label>`}).join('')}<div class="fa"><button type="button" class="btn o" onclick="closeM()">Cancel</button><button class="btn">Save</button></div></form>`);
const pf=$('#pf');if(pf)pf.onchange=()=>{const f=pf.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);photo=c.toDataURL('image/jpeg',.8);$('#pv').innerHTML=av({photo})};im.src=rd.result};rd.readAsDataURL(f)};
$('#fm').onsubmit=async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));d.photo=photo;const er=m=>{$('#er').textContent=m};
for(const f of e.f)if(f[2]!='photo'&&!OPT.includes(f[0])&&!(page=='users'&&['password','dept','fcode'].includes(f[0]))&&!String(d[f[0]]||'').trim())return er(f[1]+' is required.');
d.name!==undefined&&(d.name=d.name.trim());
try{await api(r?'PUT':'POST','/'+page+(r?'/'+r._id:''),d);await refresh();closeM();nav();render()}catch(x){er(x.message)}}}
function dash(m){const a=(S.me&&S.me.name)||'Administrator',now=new Date(),day=now.toLocaleDateString('en-US',{weekday:'long'}),nm=now.getHours()*60+now.getMinutes();
const cl=S.schedules.filter(x=>x.day==day).sort((a,b)=>a.start.localeCompare(b.start));
const R=S.me.role,pend=S.leaves.filter(x=>x.status=='Pending').length,here=x=>x.status=='Present'||x.status=='Late';
const stat=R=='faculty'?[['cal','My Classes',S.schedules.length,'Assigned'],['doc','Pending Leaves',pend,'Awaiting approval'],['clock','Days Present',S.attendance.filter(here).length,'Recorded'],['award','Grades Entered',S.grades.length,'All terms']]:[['users','Total Faculty',S.faculty.length,'In your scope'],R=='admin'?['bank','Departments',S.departments.length,'Registered']:['book','Subjects',S.subjects.length,'In the catalog'],['doc','Pending Leaves',pend,'Need review'],['clock','Present Today',S.attendance.filter(x=>x.date==today()&&here(x)).length,'Faculty checked in']];
m.innerHTML=`<div class="hero"><div><small>${now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase()}</small><h1>Hello, ${esc(a)}.</h1><p>Here’s what’s happening across your faculty today.</p></div>${R=='admin'?`<button class="btn" id="af">${ic('plus')}Add faculty</button>`:''}</div>
<div class="gr g4">${stat.map(s=>`<div class="card st"><i class="av">${ic(s[0])}</i><div><b>${String(s[2]).padStart(2,'0')}</b><span>${s[1]}</span><small>${s[3]}</small></div></div>`).join('')}</div>
<div class="gr g2"><div class="card"><div class="ph1" style="margin:0"><div><h2 style="font:500 20px Inter">${R=='admin'?'Recent activity':'Leave requests'}</h2><small class="sub">${R=='admin'?'Latest updates across the college':'Latest requests'}</small></div></div>${(R=='admin'?S.log.slice(0,5):[]).map(l=>`<div class="ri"><i class="av">${ic('edit')}</i><div>${esc(l.m)}<small>${esc(l.s)}</small></div><small>${ago(l.t)}</small></div>`).join('')+(R=='admin'?'':S.leaves.slice(0,5).map(l=>`<div class="ri"><i class="av">${ic('doc')}</i><div>${esc(l.faculty)} · ${esc(l.type)}<small>${esc(l.from)} → ${esc(l.to)}</small></div>${pill(l.status)}</div>`).join(''))||'<div class="em">Nothing here yet. Changes will show up here.</div>'}</div>
<div class="card"><h2 style="font:500 20px Inter">Upcoming classes</h2><small class="sub">${day}</small>${cl.map(x=>{const s=mins(x.start),e=mins(x.end),st=nm<s?'Upcoming':nm<e?'Ongoing':'Done';return`<div class="cl"><small style="color:var(--tx)">${t12(x.start)}</small><div>${esc(x.subject)}<small>${esc(x.section)} · ${esc(x.room)}</small></div>${pill(st=='Done'?'Inactive':st)}</div>`}).join('')||'<div class="em">No classes scheduled today.</div>'}</div></div>`;
if($('#af'))$('#af').onclick=()=>{page='faculty';nav();render();form()}}
function csv(k){const f=k=='grades'?[['subject','Subject'],['section','Section'],['studentId','Student ID'],['student','Student'],['term','Term'],['grade','Grade']]:E[k].f.filter(x=>x[2]!='photo');return[f.map(x=>x[1]).join(','),...S[k].map(r=>f.map(x=>`"${String(r[x[0]]||'').replace(/"/g,'""')}"`).join(','))].join('\n')}
function reports(m){const cnt=(arr,k)=>{const o={};arr.forEach(r=>o[r[k]||'Unassigned']=(o[r[k]||'Unassigned']||0)+1);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const bars=(arr,k)=>{const c=cnt(arr,k),mx=Math.max(1,...c.map(x=>x[1]));return c.map(([n,v])=>`<div class="bar"><span>${esc(n)}</span><i style="width:${v/mx*60}%"></i><b>${v}</b></div>`).join('')||'<small class="sub">No data yet.</small>'};
m.innerHTML=`<div class="ph1"><div><h1>Reports</h1><p>Summaries of your college records, computed from live data.</p></div></div>
<div class="gr g4" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h2>Faculty by department</h2>${bars(S.faculty,'dept')}</div><div class="card"><h2>Faculty by status</h2>${bars(S.faculty,'status')}</div><div class="card"><h2>Staff by employment type</h2>${bars(S.nonfaculty,'type')}</div><div class="card"><h2>Classes per day</h2>${bars(S.schedules,'day')}</div><div class="card"><h2>Leave requests by status</h2>${bars(S.leaves,'status')}</div><div class="card"><h2>Attendance by status</h2>${bars(S.attendance,'status')}</div></div>
<div class="card"><h2 style="margin-bottom:10px">Export data as CSV</h2><div class="fa" style="justify-content:flex-start;flex-wrap:wrap">${['faculty','nonfaculty','subjects','schedules','leaves','attendance','grades'].map(k=>`<button class="btn o" data-x="${k}">${E[k].t}</button>`).join('')}</div></div>`;
m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>dl(b.dataset.x+'.csv','\ufeff'+csv(b.dataset.x),'text/csv'))}
function settings(m){m.innerHTML=`<div class="ph1"><div><h1>Settings</h1><p>Update your account details and password.</p></div></div>
<div class="card" style="max-width:600px;margin-bottom:20px"><form id="sf">${S.me.role=='admin'?`<label>College name<input name="college" value="${esc(S.cfg.college)}"></label>`:''}<label>Your name<input name="name" value="${esc(S.me&&S.me.name)}"></label><label>New password (leave blank to keep)<input name="password" type="password" minlength="6" autocomplete="new-password"></label><button class="btn">Save changes</button> <span id="sm" class="sub"></span></form></div>
${S.me.role!='admin'?'':`<div class="card" style="max-width:600px"><h2 style="margin-bottom:6px">Backup and reset</h2><p class="sub">Download all records as a file, restore them later, or start over.</p><div class="fa" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn o" id="bk">Download backup</button><button class="btn o" id="rs">Restore from file</button><input type="file" id="rf" accept=".json" hidden><button class="btn d" id="er2">Erase all data</button></div></div>`}`;
$('#sf').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api('PUT','/settings',d);await refresh();nav();$('#sm').textContent='Saved.'}catch(x){$('#sm').textContent=x.message}};
if($('#bk'))$('#bk').onclick=async()=>dl('idsc-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(await api('GET','/backup'),null,2));
if($('#rs'))$('#rs').onclick=()=>$('#rf').click();
if($('#rf'))$('#rf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{await api('POST','/restore',JSON.parse(r.result));await refresh();nav();render();$('#sm').textContent='Backup restored.'}catch(x){$('#sm').textContent=x.message||'Invalid backup file.'}};r.readAsText(f)};
if($('#er2'))$('#er2').onclick=()=>{modal(`<h2>Erase all data?</h2><p>Every faculty, staff, department, subject, and schedule record will be deleted. Your login stays. This can’t be undone.</p><div class="fa"><button class="btn o" onclick="closeM()">Cancel</button><button class="btn d" id="yes">Erase everything</button></div>`);$('#yes').onclick=async()=>{await api('POST','/reset');await refresh();closeM();nav();render()}}}
$('#nv').onclick=e=>{const b=e.target.closest('[data-p]');if(b)go(b.dataset.p)};
$('#bl').onclick=()=>go('leaves');
$('#gs').oninput=e=>{const v=e.target.value;if(!E[page])go(S.me&&S.me.role=='faculty'?'schedules':'faculty');ls.q=v;ls.p=1;$('#gs').value=v;const q=$('#q');if(q)q.value=v;draw()};
let setup=false;
function login(su){setup=su;$('#lt').textContent=su?'Set up your college':(S.cfg.college||'Sign in');$('#lsub').textContent=su?'Create the first administrator account.':'Sign in to manage faculty, staff, subjects, and class schedules.';$('#lx').style.display=su?'':'none';$('#le').textContent='';$('#lg').classList.add('s')}
$('#lf').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api('POST',setup?'/setup':'/login',d);$('#lg').classList.remove('s');e.target.reset();await start()}catch(x){$('#le').textContent=x.message}};
async function start(){await refresh();nav();go('dashboard')}
async function boot(){try{const s=await api('GET','/status');S.cfg=s.cfg||S.cfg;nav();if(s.user)start();else login(s.needsSetup)}catch(e){$('#main').innerHTML='<div class="em"><b>Can’t reach the server</b>Make sure it is running (npm start), then refresh this page.</div>'}}
$('#out').onclick=async()=>{try{await api('POST','/logout')}catch(e){}S.me=null;boot()};
nav();boot();
</script></body></html>
