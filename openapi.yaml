
openapi: 3.0.3

info:
  title: Faculty Module API
  version: 1.0.0
  description: REST API for managing faculty and department records.

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server

tags:
  - name: Health
  - name: Faculty
  - name: Department

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check API status
      operationId: getHealth
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /departments:
    get:
      tags:
        - Department
      summary: Get all departments
      operationId: getDepartments
      responses:
        "200":
          description: Departments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Department"

    post:
      tags:
        - Department
      summary: Create a department
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentPayload"
      responses:
        "201":
          description: Department created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /departments/{departmentId}:
    parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: string

    get:
      tags:
        - Department
      summary: Get department by ID
      operationId: getDepartmentById
      responses:
        "200":
          description: Department retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Department
      summary: Update department
      operationId: updateDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentPayload"
      responses:
        "200":
          description: Department updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          $ref: "#/components/responses/NotFound"

  /faculty:
    get:
      tags:
        - Faculty
      summary: Get all faculty members
      operationId: getFaculty
      responses:
        "200":
          description: Faculty records retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faculty"

    post:
      tags:
        - Faculty
      summary: Create a faculty member
      operationId: createFaculty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacultyPayload"
      responses:
        "201":
          description: Faculty created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faculty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Department not found
        "409":
          $ref: "#/components/responses/Conflict"

  /faculty/{facultyId}:
    parameters:
      - name: facultyId
        in: path
        required: true
        schema:
          type: string

    get:
      tags:
        - Faculty
      summary: Get faculty by ID
      operationId: getFacultyById
      responses:
        "200":
          description: Faculty retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faculty"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Faculty
      summary: Update faculty
      operationId: updateFaculty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacultyPayload"
      responses:
        "200":
          description: Faculty updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faculty"
        "404":
          $ref: "#/components/responses/NotFound"

  /faculty/{facultyId}/disable:
    parameters:
      - name: facultyId
        in: path
        required: true
        schema:
          type: string

    patch:
      tags:
        - Faculty
      summary: Deactivate faculty
      operationId: disableFaculty
      responses:
        "200":
          description: Faculty deactivated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faculty"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    DepartmentPayload:
      type: object
      required:
        - department_name
      properties:
        department_name:
          type: string
        description:
          type: string

    Department:
      allOf:
        - $ref: "#/components/schemas/DepartmentPayload"
        - type: object
          properties:
            _id:
              type: string
            createdAt:
              type: string
              format: date-time

    FacultyPayload:
      type: object
      required:
        - name
        - department_id
        - position
        - email
      properties:
        name:
          type: string
        department_id:
          type: string
        position:
          type: string
        email:
          type: string
          format: email

    Faculty:
      allOf:
        - $ref: "#/components/schemas/FacultyPayload"
        - type: object
          properties:
            _id:
              type: string
            status:
              type: string
              enum:
                - ACTIVE
                - INACTIVE
            createdAt:
              type: string
              format: date-time

    Error:
      type: object
      properties:
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: Duplicate record
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
